name: Verify Hearth
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Verify isolated shared AI key policy
        run: node tests/key-policy.integration.mjs
      - name: Verify atomic invitation and access changes
        run: npm run test:plan-effects
      - name: Verify Firebase gateway
        run: |
          npm ci --prefix gateway
          npm run build --prefix gateway
          node --test tests/gateway.test.mjs
      - run: npm run build
      - name: Create ephemeral local encryption secret
        run: node -e "require('fs').writeFileSync('.dev.vars', 'KEY_ENCRYPTION_SECRET='+require('crypto').randomBytes(32).toString('base64')+'\nLOCAL_DEMO_AUTH=0\n')"
      - name: Apply local schema
        run: |
          node --import ./scripts/sites-env.mjs ./node_modules/wrangler/bin/wrangler.js d1 execute DB --local --config dist/server/wrangler.json --persist-to .wrangler/state --file drizzle/0000_smart_prism.sql
          node --import ./scripts/sites-env.mjs ./node_modules/wrangler/bin/wrangler.js d1 execute DB --local --config dist/server/wrangler.json --persist-to .wrangler/state --file drizzle/0001_fantastic_maggott.sql
      - name: Verify downstream API and persistence
        run: |
          node scripts/start-api-test.mjs > /tmp/hearth-test-worker.log 2>&1 &
          worker_pid=$!
          cleanup() {
            result=$?
            trap - EXIT
            if [ "$result" -ne 0 ]; then
              echo "Worker diagnostics for the failed integration run:"
              cat /tmp/hearth-test-worker.log
            fi
            kill "$worker_pid" 2>/dev/null || true
            exit "$result"
          }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl --max-time 2 -s http://127.0.0.1:5176/api/workspace | head -c 200 | grep -q 'Sign in'; then break; fi
            sleep 1
          done
          api_result=0
          npm run test:api || api_result=$?
          pooled_result=0
          TEST_REJECTION_TRANSPORT=pooled node tests/rejection-transport.mjs || pooled_result=$?
          isolated_result=0
          TEST_REJECTION_TRANSPORT=close-rejected node tests/rejection-transport.mjs || isolated_result=$?
          if [ "$api_result" -ne 0 ] || [ "$pooled_result" -ne 0 ] || [ "$isolated_result" -ne 0 ]; then
            echo "Integration results: api=$api_result pooled=$pooled_result close-rejected=$isolated_result"
            exit 1
          fi
      - name: Preserve failed Worker diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hearth-worker-diagnostics
          path: /tmp/hearth-test-worker.log
          if-no-files-found: ignore
          retention-days: 7
